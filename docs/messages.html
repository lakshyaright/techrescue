<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages - TechRescue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script src="app.js"></script>
    <script>
      requireAuth("expert");
      document.body.innerHTML = expertShell("messages", `
        <div class="page-title"><h1>Messages</h1><p>Recent conversations and client updates.</p></div>
        <section class="list">
          <article class="card"><h3>Client John</h3><p>Please check the server issue urgently.</p><small>10 mins ago</small></article>
          <article class="card"><h3>Client Sarah</h3><p>Can you configure firewall today?</p><small>1 hour ago</small></article>
        </section>
      `);
      loadCurrentUser();
    </script>
  </body>
</html>
