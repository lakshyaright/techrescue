<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expert Dashboard - TechRescue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script src="app.js"></script>
    <script>
      const auth = requireAuth("expert");
      document.body.innerHTML = expertShell("dashboard", `
        <div class="page-title"><h1>Dashboard</h1><p>Manage availability, alerts, and expert profile completion.</p></div>
        <section class="metrics">
          <div class="metric"><strong id="earnings">$0</strong><span>Total Earnings</span></div>
          <div class="metric"><strong id="jobsCompleted">0</strong><span>Jobs Completed</span></div>
          <div class="metric"><strong id="rating">-</strong><span>Client Rating</span></div>
          <div class="metric"><strong id="statusValue">Offline</strong><span>Status</span></div>
        </section>
        <section class="card" style="margin-top:18px">
          <div class="availability-control">
            <div><h3>Availability</h3><p id="availabilityHint">You are currently offline and will not accept new tickets.</p></div>
            <button class="button availability-toggle" id="statusToggle" type="button" aria-pressed="false" onclick="toggleStatus()">Go Online</button>
          </div>
        </section>
        <section class="layout-two">
          <div class="card"><h3>New Alerts</h3><div id="alertsContainer" class="list"><p>Loading alerts...</p></div></div>
          <div class="card"><h3>Upcoming Jobs</h3><p>No jobs scheduled.</p></div>
        </section>
        <p id="pageMsg" class="message"></p>
      `);

      async function checkProfile() {
        try {
          const profile = await apiFetch("/profile");
          if (!profile) window.location.href = "profile.html";
        } catch {
          window.location.href = "profile.html";
        }
      }

      async function toggleStatus() {
        const button = qs("#statusToggle");
        const online = button.getAttribute("aria-pressed") !== "true";
        button.disabled = true;
        try {
          await apiFetch("/update-status", { method: "POST", body: JSON.stringify({ online }) });
          renderAvailability(online);
          setMessage("pageMsg", online ? "You are now online and can accept tickets." : "You are now offline.", "success");
        } catch (error) {
          setMessage("pageMsg", error.message, "error");
        } finally {
          button.disabled = false;
        }
      }

      function renderAvailability(online) {
        const button = qs("#statusToggle");
        if (!button) return;
        button.setAttribute("aria-pressed", String(online));
        button.textContent = online ? "Go Offline" : "Go Online";
        button.classList.toggle("online", online);
        qs("#statusValue").textContent = online ? "Online" : "Offline";
        qs("#availabilityHint").textContent = online
          ? "You are online and can accept new tickets."
          : "You are currently offline and will not accept new tickets.";
      }

      async function loadAlerts() {
        try {
          const alerts = await apiFetch("/expert-alerts");
          qs("#alertsContainer").innerHTML = (alerts || []).map((alert) => `
            <article class="notice"><strong>${escapeHtml(alert.ticket_number || "-")}</strong><p>${escapeHtml(alert.short_description || "")}</p><div class="actions"><button class="button secondary" onclick="respondToAlert('${encodeURIComponent(alert.ticket_number || "")}')">Respond</button><button class="button ghost" onclick="ignoreAlert('${encodeURIComponent(alert.ticket_number || "")}')">Ignore</button></div></article>
          `).join("") || "<p>No new alerts.</p>";
        } catch (error) {
          setMessage("pageMsg", error.message, "error");
        }
      }

      async function respondToAlert(ticketNumber) {
        ticketNumber = decodeURIComponent(ticketNumber);
        if (qs("#statusToggle").getAttribute("aria-pressed") !== "true") {
          setMessage("pageMsg", "Set your availability to Online before responding to a ticket.", "error");
          return;
        }
        try {
          await apiFetch("/accept-ticket", { method: "POST", body: JSON.stringify({ ticket_number: ticketNumber }) });
          setMessage("pageMsg", `Ticket ${ticketNumber} accepted. Open the response form now.`, "success");
          window.location.href = "alerts.html?ticket=" + encodeURIComponent(ticketNumber);
        } catch (error) {
          setMessage("pageMsg", error.message || "Unable to accept this ticket.", "error");
        }
      }

      async function ignoreAlert(ticketNumber) {
        ticketNumber = decodeURIComponent(ticketNumber);
        try {
          await apiFetch("/update-query-status", { method: "POST", body: JSON.stringify({ ticket_number: ticketNumber, status: "ignored" }) });
          setMessage("pageMsg", `Ticket ${ticketNumber} was ignored.`, "success");
          loadAlerts();
        } catch (error) {
          setMessage("pageMsg", error.message || "Unable to ignore this ticket.", "error");
        }
      }

      if (auth) {
        loadCurrentUser().then((user) => {
          renderAvailability(Boolean(user?.online));
        });
        checkProfile();
        loadAlerts();
        setInterval(loadAlerts, 10000);
      }
    </script>
  </body>
</html>
