<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alerts - TechRescue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script src="app.js"></script>
    <script>
      requireAuth("expert");
      document.body.innerHTML = expertShell("alerts", `
        <div class="page-title"><h1>Alerts</h1><p>Resolve in-progress tickets and open chat for ticket conversations.</p></div>
        <section class="metrics"><div class="metric"><strong id="inProgressCount">0</strong><span>In Progress</span></div><div class="metric"><strong id="resolvedCount">0</strong><span>Resolved</span></div></section>
        <section class="layout-two"><div class="card"><h3>In Progress Tickets</h3><div id="inProgressList" class="list"></div></div><div class="card"><h3>Resolved Tickets</h3><div id="resolvedList" class="list"></div></div></section>
        <p id="pageMsg" class="message"></p>
      `);
      loadCurrentUser();

      async function loadEngineerAlerts() {
        try {
          const data = await apiFetch("/engineer-alerts");
          const inProgress = (data || []).filter((t) => t.status === "in_progress");
          const resolved = (data || []).filter((t) => t.status === "resolved");
          qs("#inProgressCount").textContent = inProgress.length;
          qs("#resolvedCount").textContent = resolved.length;
          qs("#inProgressList").innerHTML = renderTicketCards(inProgress, true);
          qs("#resolvedList").innerHTML = renderTicketCards(resolved, false);
        } catch (error) {
          setMessage("pageMsg", error.message, "error");
        }
      }

      function renderTicketCards(items, canResolve) {
        return items.map((ticket) => `<article class="notice"><strong>${escapeHtml(ticket.ticket_number || "-")}</strong><p>${escapeHtml(ticket.short_description || "")}</p><small>${formatDate(ticket.created_at)}</small><div class="actions">${canResolve ? `<button class="button primary" onclick="resolveTicket('${encodeURIComponent(ticket.ticket_number || "")}')">Resolve</button>` : ""}<button class="button secondary" onclick="openChat('${encodeURIComponent(ticket.ticket_number || "")}')">Chat</button></div></article>`).join("") || "<p>No tickets.</p>";
      }

      async function resolveTicket(ticketNumber) {
        ticketNumber = decodeURIComponent(ticketNumber);
        const resolution_note = prompt("Enter resolution note:");
        if (!resolution_note) return;
        await apiFetch("/resolve-ticket", { method: "POST", body: JSON.stringify({ ticket_number: ticketNumber, resolution_note }) });
        loadEngineerAlerts();
      }

      function openChat(ticketNumber) {
        ticketNumber = decodeURIComponent(ticketNumber);
        window.location.href = "chat.html?ticket=" + encodeURIComponent(ticketNumber);
      }

      loadEngineerAlerts();
      setInterval(loadEngineerAlerts, 10000);
    </script>
  </body>
</html>
